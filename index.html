<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Willow Hollow – a tiny 3D portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fff6e3;
      --ink: #5a3e2b;
      --rose: #e58f9c;
      --sky: linear-gradient(#6fb1ea 0%, #a6d2f3 26%, #f7e6c6 46%, #f3e5c8 100%);
      color-scheme: light dark
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --paper: #3b3329;
        --ink: #f6e8d0;
        --sky: linear-gradient(#27384f, #56607a 30%, #e3c9a4 48%, #e8d4b0 100%)
      }
    }

    :root[data-theme="dark"] {
      --paper: #3b3329;
      --ink: #f6e8d0;
      --sky: linear-gradient(#27384f, #56607a 30%, #e3c9a4 48%, #e8d4b0 100%)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      font-family: Fredoka, ui-rounded, system-ui, sans-serif;
      background: var(--sky);
      color: var(--ink);
      overflow: hidden;
      touch-action: manipulation
    }

    #stage {
      position: fixed;
      inset: 0;
      touch-action: none
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    #brand {
      position: fixed;
      z-index: 5;
      right: max(14px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      background: var(--paper);
      padding: 9px 16px;
      border-radius: 20px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .12);
      text-align: right
    }

    #brand b {
      display: block;
      font-size: 19px
    }

    #brand small {
      opacity: .75
    }

    #chips {
      display: none;
      position: fixed;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      padding: 6px 12px;
      overflow-x: auto;
      justify-content: center;
      scrollbar-width: none
    }

    .chip {
      flex: none;
      border: 0;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .14);
      transition: transform .2s cubic-bezier(.34, 1.56, .64, 1)
    }

    .chip:hover,
    .chip:focus-visible,
    .chip.cur {
      transform: translateY(-3px) scale(1.06);
      outline: 0
    }

    .chip.cur {
      background: #f7dc86;
      color: #5a3e2b
    }

    #tip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 6;
      pointer-events: none;
      background: var(--paper);
      padding: 5px 12px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .15s;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .14)
    }

    #panel {
      position: fixed;
      z-index: 8;
      right: max(20px, env(safe-area-inset-right));
      top: 50%;
      width: min(420px, calc(100vw - 40px));
      max-height: 74vh;
      overflow: auto;
      background: var(--paper);
      border-radius: 30px;
      padding: 24px 26px;
      border: 3px dashed rgba(140, 100, 70, .35);
      box-shadow: 0 10px 0 rgba(0, 0, 0, .12), 0 24px 60px rgba(60, 40, 20, .3);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(.15);
      transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .25s
    }

    #panel.on {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1)
    }

    body.zoom #panel[data-section="about"] {
      width: min(500px, calc(100vw - 40px));
      padding: 28px 30px
    }

    body.zoom #panel:not([data-section="about"]) {
      width: min(500px, calc(100vw - 40px));
      padding: 28px 30px
    }

    body.zoom #panel[data-section="values"] {
      width: min(320px, calc(100vw - 40px))
    }

    #panel h2 {
      margin: 4px 0 10px;
      font-size: 26px
    }

    #pe {
      font-size: 44px;
      line-height: 1
    }

    #panel a {
      color: #c0566a
    }

    #panel li {
      margin: 6px 0
    }

    #x {
      position: absolute;
      right: 14px;
      top: 12px;
      border: 0;
      background: #f7dc86;
      color: #5a3e2b;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font: 600 20px Fredoka, sans-serif;
      cursor: pointer
    }

    @media(max-width:700px) {
      #panel {
        right: 50%;
        top: auto;
        bottom: calc(66px + env(safe-area-inset-bottom));
        max-height: 46vh;
        transform: translate(50%, 0) scale(.15)
      }

      #panel.on {
        transform: translate(50%, 0) scale(1)
      }

      #chips {
        justify-content: flex-start
      }

      #brand small {
        display: none
      }
    }

    #back {
      position: fixed;
      z-index: 7;
      left: max(14px, env(safe-area-inset-left));
      top: max(12px, env(safe-area-inset-top));
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start
    }

    body.in #back {
      display: flex
    }

    body.in #brand {
      display: none
    }

    body.zoom #back span {
      display: none
    }

    #back button {
      border: 0;
      background: var(--paper);
      color: var(--ink);
      font: 600 16px Fredoka, sans-serif;
      padding: 10px 16px;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .14)
    }

    #back span {
      background: var(--paper);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 13px
    }

    .nogl #stage {
      display: none
    }

    .nogl #chips {
      display: flex;
      inset: 0;
      flex-wrap: wrap;
      align-content: center;
      padding: 90px 20px;
      overflow: auto
    }

    .nogl .chip {
      font-size: 20px;
      padding: 16px 22px
    }

  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="brand"><b>Shekina's Meadow</b><small>Tap the critters, cottage &amp; flowers</small></div>
  <div id="back"><button id="bk">← Back to the garden</button><span>Click a book to explore projects and experience</span></div>
  <div id="tip"></div>

    <div id="pe"></div>
    <h2 id="pt"></h2>
    <div id="pb"></div>
  </aside>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        clouds.forEach(c => { c.position.x += dt * .5; if (c.position.x > 60) c.position.x = -60 });
        hot.forEach((g, i) => {
          const u = g.userData, isBook = !!u.parts.cover, settledBook = isBook && (u.bookOpening || u.bookOpen || u.bookClosing), on = g === hov && !settledBook;

            if (u.parts.butterfly) { u.parts.lw.rotation.y = w; u.parts.rw.rotation.y = -w }
            else { u.parts.lw.rotation.z = w; u.parts.rw.rotation.z = -w }
          }
          if (u.parts.blades) u.parts.blades.rotation.z = t * .4;
          if (u.parts.heads && !u.anim) u.parts.heads.forEach((h, j) => h.rotation.z = Math.sin(t * 1.5 + j) * .08);
          if (u.pageTurn) {
            const turn = u.pageTurn, p = clamp((now - turn.t0) / turn.d, 0, 1), progress = sm(p);
            u.parts.pages[turn.index].rotation.y = turn.from + (turn.to - turn.from) * progress;
            if (p >= 1) {
              u.parts.pages[turn.index].rotation.y = turn.to; u.pageTurn = null;
              u.parts.showSpread(u.bookTurnCount)
            }
          }
          if (u.anim) {
            const p = (now - u.anim.t0) / u.anim.d;
            if (u.fx) u.fx(g, Math.min(p, 1));
            if (p >= 1) {
              u.anim = null; g.rotation.y = u.r0; g.rotation.z = 0;
              if (u.bookClosing) { u.bookClosing = false; u.bookCloseAngle = 0; u.bookPageAngles = []; houseG.userData.parts.readingLight.visible = true }
              else if (u.bookOpening) {
                u.bookOpening = false; u.bookOpen = true; u.bookTurnCount = 0;
                if (openingBook === g) { openingBook = null; if (stage === 3) focusOn(g) }
              }
            }

        });
        renderer.render(scene, cam);
        if (hov && !(fg && fg.userData.parts.cover)) { const p = scr(hov); tip.textContent = hov.userData.lab; tip.style.transform = `translate(${p.x}px,${p.y - 12}px) translate(-50%,-100%)`; tip.style.opacity = 1 } else tip.style.opacity = 0;
      }

    })();
