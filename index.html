<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Willow Hollow – a tiny 3D portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fff6e3;
            --ink: #5a3e2b;
            --rose: #e58f9c;
            --sky: linear-gradient(#bfe6ee 0%, #f9efd2 75%, #f6dfbd 100%);
            color-scheme: light dark
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --paper: #3b3329;
                --ink: #f6e8d0;
                --sky: linear-gradient(#2b3d52, #5a5568 80%, #6d5d5a)
            }
        }

        :root[data-theme="dark"] {
            --paper: #3b3329;
            --ink: #f6e8d0;
            --sky: linear-gradient(#2b3d52, #5a5568 80%, #6d5d5a)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            font-family: Fredoka, ui-rounded, system-ui, sans-serif;
            background: var(--sky);
            color: var(--ink);
            overflow: hidden;
            touch-action: manipulation
        }

        #stage {
            position: fixed;
            inset: 0
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #brand {
            position: fixed;
            z-index: 5;
            left: max(14px, env(safe-area-inset-left));
            top: max(12px, env(safe-area-inset-top));
            background: var(--paper);
            padding: 9px 16px;
            border-radius: 20px;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .12)
        }

        #brand b {
            display: block;
            font-size: 19px
        }

        #brand small {
            opacity: .75
        }

        #chips {
            position: fixed;
            z-index: 5;
            left: 0;
            right: 0;
            bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            gap: 8px;
            padding: 6px 12px;
            overflow-x: auto;
            justify-content: center;
            scrollbar-width: none
        }

        .chip {
            flex: none;
            border: 0;
            background: var(--paper);
            color: var(--ink);
            font: inherit;
            padding: 8px 14px;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .14);
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1)
        }

        .chip:hover,
        .chip:focus-visible,
        .chip.cur {
            transform: translateY(-3px) scale(1.06);
            outline: 0
        }

        .chip.cur {
            background: #f7dc86;
            color: #5a3e2b
        }

        #tip {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6;
            pointer-events: none;
            background: var(--paper);
            padding: 5px 12px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity .15s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .14)
        }

        .dot {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 4;
            width: 14px;
            height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--rose);
            pointer-events: none;
            animation: pulse 1.8s infinite
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 143, 156, .75)
            }

            100% {
                box-shadow: 0 0 0 16px rgba(229, 143, 156, 0)
            }
        }

        #panel {
            position: fixed;
            z-index: 8;
            right: max(20px, env(safe-area-inset-right));
            top: 50%;
            width: min(420px, calc(100vw - 40px));
            max-height: 78vh;
            overflow: auto;
            background: var(--paper);
            border-radius: 30px;
            padding: 24px 26px;
            border: 3px dashed rgba(140, 100, 70, .35);
            box-shadow: 0 10px 0 rgba(0, 0, 0, .12), 0 24px 60px rgba(60, 40, 20, .3);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(.15);
            transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .25s
        }

        #panel.on {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1)
        }

        #panel h2 {
            margin: 4px 0 10px;
            font-size: 26px
        }

        #pe {
            font-size: 44px;
            line-height: 1
        }

        #panel a {
            color: #c0566a
        }

        #panel li {
            margin: 6px 0
        }

        #x {
            position: absolute;
            right: 14px;
            top: 12px;
            border: 0;
            background: #f7dc86;
            color: #5a3e2b;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font: 600 20px Fredoka, sans-serif;
            cursor: pointer
        }

        @media(max-width:700px) {
            #panel {
                right: 50%;
                top: auto;
                bottom: calc(66px + env(safe-area-inset-bottom));
                max-height: 50vh;
                transform: translate(50%, 0) scale(.15)
            }

            #panel.on {
                transform: translate(50%, 0) scale(1)
            }

            #chips {
                justify-content: flex-start
            }
        }

        .nogl #stage,
        .nogl .dot {
            display: none
        }

        .nogl #chips {
            inset: 0;
            flex-wrap: wrap;
            align-content: center;
            padding: 90px 20px;
            overflow: auto
        }

        .nogl .chip {
            font-size: 20px;
            padding: 16px 22px
        }
    </style>
</head>
